name: Hero browser measurement
on:
  push:
    branches: [qa/hero-render-20261121]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
        sample: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/region-check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser client
        run: npm install --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/hero-test" puppeteer-core@25.18.1
      - name: Cold browser visit
        env:
          VIEWPORT: ${{ matrix.viewport }}
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          export RESULT_JSON="$RUNNER_TEMP/hero-test/measure.json"
          export SCENE_PNG="$RUNNER_TEMP/hero-test/scene.png"
          export PUPPETEER_MODULE="$RUNNER_TEMP/hero-test/node_modules/puppeteer-core"
          node tools/region-check/measure.cjs "$VIEWPORT"
      - name: Save observed scene and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.viewport }}-${{ matrix.sample }}
          path: |
            ${{ runner.temp }}/hero-test/measure.json
            ${{ runner.temp }}/hero-test/scene.png
          retention-days: 7
