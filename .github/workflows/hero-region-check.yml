name: A/B test homepage preload on GitHub Pages
on:
  push:
    branches: [qa/gh-home-preload-kdrch7]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/region-check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser client
        run: npm install --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/hero-test" puppeteer-core@25.18.1
      - name: Paired cold visits to the original export
        env:
          VIEWPORT: ${{ matrix.viewport }}
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          export PUPPETEER_MODULE="$RUNNER_TEMP/hero-test/node_modules/puppeteer-core"
          export ORIGINAL_RESULT_DIR="$RUNNER_TEMP/original-pair"
          export PAIR_ID="combined-$VIEWPORT"
          mkdir -p "$ORIGINAL_RESULT_DIR"
          if [ "$VIEWPORT" = desktop ]; then order="B1 A1 A2 B2"; else order="A1 B1 B2 A2"; fi
          curl -fsS --max-time 8 https://ipinfo.io/json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{try{const {city,region,country}=JSON.parse(s);console.log(JSON.stringify({city,region,country}))}catch{console.log("{}")}})' > "$ORIGINAL_RESULT_DIR/location.json" || true
          status=0
          for host in $order; do
            node tools/region-check/preload-ab.cjs "$VIEWPORT" "$host" || status=1
          done
          exit "$status"
      - name: Save both browser observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-${{ matrix.viewport }}
          path: ${{ runner.temp }}/original-pair
          retention-days: 7
