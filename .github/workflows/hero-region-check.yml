name: Compare HTTP delivery of the original scene
on:
  push:
    branches: [qa/hero-render-20261121]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/region-check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser client
        run: npm install --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/hero-test" puppeteer-core@25.18.1
      - name: Paired cold visits to the original export
        env:
          VIEWPORT: ${{ matrix.viewport }}
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          export PUPPETEER_MODULE="$RUNNER_TEMP/hero-test/node_modules/puppeteer-core"
          export ORIGINAL_RESULT_DIR="$RUNNER_TEMP/original-pair"
          export PAIR_ID="triplet-$VIEWPORT"
          mkdir -p "$ORIGINAL_RESULT_DIR"
          if [ "$VIEWPORT" = desktop ]; then order="candidate fixed main"; else order="main fixed candidate"; fi
          status=0
          for host in $order; do
            node tools/region-check/original.cjs "$VIEWPORT" "$host" || status=1
          done
          exit "$status"
      - name: Save both browser observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triplet-${{ matrix.viewport }}
          path: ${{ runner.temp }}/original-pair
          retention-days: 7
