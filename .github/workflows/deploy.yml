name: Deploy site to GitHub Pages

# 在云端用 Node 20 构建 Next.js 静态导出（本地 Node 18 无法构建 Next 16），
# 产物 site/out 发布到 GitHub Pages。URL: https://calibg.github.io/cali-YANG/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # basePath 前缀，需与仓库名一致（项目页挂在 /<repo>/ 下）
          NEXT_PUBLIC_BASE_PATH: /cali-YANG

      # 禁用 Jekyll，避免以 _ 开头的 _next 目录被忽略
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
